server:
  port: 8090

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # MICROSERVICIO: PACIENTES
            - id: pacientes
              uri: lb://ms-pacientes
              predicates:
                - Path=/api/pacientes/**

            - id: historial-pacientes
              uri: lb://ms-pacientes
              predicates:
                - Path=/api/historiales/**

            # MICROSERVICIO: PROVEEDORES
            - id: proveedores
              uri: lb://ms-proveedores
              predicates:
                - Path=/api/proveedores/**

            - id: ordenes-compra
              uri: lb://ms-proveedores
              predicates:
                - Path=/api/ordenes-compra/**

            # MICROSERVICIO: MEDICOS
            - id: medicos
              uri: lb://ms-medicos
              predicates:
                - Path=/api/medicos/**

            - id: especiales
              uri: lb://ms-medicos
              predicates:
                - Path=/api/especialidades/**

            # MICROSERVICIO: CITAS MÉDICAS
            - id: citamedica
              uri: lb://ms-citamedica
              predicates:
                - Path=/api/citas/**

            - id: salas
              uri: lb://ms-citamedica
              predicates:
                - Path=/api/salas/**

            # MICROSERVICIO: CITAS MÉDICAS
            - id: inventario
              uri: lb://ms-inventario
              predicates:
                - Path=/api/productos/**
            
            - id: movimientos
              uri: lb://ms-inventario
              predicates:
                - Path=/api/movimientos/**
            

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true