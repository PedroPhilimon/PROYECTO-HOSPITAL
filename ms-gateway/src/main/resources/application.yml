server:
    port: 8090

spring:
    application:
        name: gateway
    cloud:
        gateway:
            server:
                webmvc:
                    routes:
                        - id: pacientes
                          uri: lb://pacientes
                          predicates:
                            - Path=/pacientes/** 

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
        instance:
          prefer-ip-address: true